name: Build Spider Clock APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/spiderclock/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  org.gradle.api.initialization.resolve.RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SpiderClock"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.spiderclock.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.spiderclock.app"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/proguard-rules.pro <<'EOF'
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.SpiderClock">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <receiver
                      android:name=".SpiderClockWidget"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="android.intent.action.TIME_CHANGED" />
                          <action android:name="android.intent.action.TIMEZONE_CHANGED" />
                          <action android:name="android.intent.action.DATE_CHANGED" />
                          <action android:name="com.spiderclock.app.ACTION_TICK" />
                      </intent-filter>

                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/spider_clock_info" />

                  </receiver>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>
              <string name="app_name">Spider Clock</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="Theme.SpiderClock"
                  parent="android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:colorAccent">#FF8A00</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/res/layout/widget_spider_clock.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <FrameLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:padding="0dp">

              <ImageView
                  android:id="@+id/clock_image"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:scaleType="fitCenter"
                  android:contentDescription="@string/app_name" />

          </FrameLayout>
          EOF          cat > app/src/main/res/xml/spider_clock_info.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <appwidget-provider
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="180dp"
              android:minHeight="180dp"
              android:minResizeWidth="120dp"
              android:minResizeHeight="120dp"
              android:updatePeriodMillis="0"
              android:initialLayout="@layout/widget_spider_clock"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen"
              android:description="@string/app_name" />
          EOF

          cat > app/src/main/java/com/spiderclock/app/MainActivity.kt <<'EOF'
          package com.spiderclock.app

          import android.app.Activity
          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.TextView

          class MainActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val text = TextView(this).apply {
                      text = "Spider Clock\n\nAdd the Spider Clock widget to your home screen."
                      textSize = 18f
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.BLACK)
                      gravity = Gravity.CENTER
                      setPadding(40, 40, 40, 40)
                  }

                  setContentView(text)

                  SpiderClockWidget.updateAll(this)
              }
          }
          EOF

          cat > app/src/main/java/com/spiderclock/app/SpiderClockWidget.kt <<'EOF'
          package com.spiderclock.app

          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.PorterDuff
          import android.graphics.Shader
          import android.graphics.Typeface
          import android.os.Build
          import android.widget.RemoteViews
          import java.util.Calendar
          import kotlin.math.cos
          import kotlin.math.min
          import kotlin.math.sin

          class SpiderClockWidget : AppWidgetProvider() {

              override fun onEnabled(context: Context) {
                  super.onEnabled(context)
                  updateAll(context)
              }

              override fun onDisabled(context: Context) {
                  cancelTick(context)
                  super.onDisabled(context)
              }

              override fun onUpdate(
                  context: Context,
                  manager: AppWidgetManager,
                  ids: IntArray
              ) {
                  for (id in ids) {
                      updateOne(context, manager, id)
                  }

                  scheduleNextMinute(context)
              }

              override fun onReceive(
                  context: Context,
                  intent: Intent
              ) {
                  super.onReceive(context, intent)

                  when (intent.action) {
                      ACTION_TICK,
                      Intent.ACTION_TIME_CHANGED,
                      Intent.ACTION_TIMEZONE_CHANGED,
                      Intent.ACTION_DATE_CHANGED -> {
                          updateAll(context)
                      }
                  }
              }

              companion object {

                  private const val ACTION_TICK =
                      "com.spiderclock.app.ACTION_TICK"

                  fun updateAll(context: Context) {

                      val manager =
                          AppWidgetManager.getInstance(context)

                      val component =
                          ComponentName(
                              context,
                              SpiderClockWidget::class.java
                          )

                      val ids =
                          manager.getAppWidgetIds(component)

                      for (id in ids) {
                          updateOne(context, manager, id)
                      }

                      if (ids.isNotEmpty()) {
                          scheduleNextMinute(context)
                      }
                  }

                  private fun updateOne(
                      context: Context,
                      manager: AppWidgetManager,
                      id: Int
                  ) {

                      val options =
                          manager.getAppWidgetOptions(id)

                      val widthDp =
                          options.getInt(
                              AppWidgetManager.OPTION_APPWIDGET_MIN_WIDTH,
                              180
                          ).coerceAtLeast(120)

                      val heightDp =
                          options.getInt(
                              AppWidgetManager.OPTION_APPWIDGET_MIN_HEIGHT,
                              180
                          ).coerceAtLeast(120)

                      val density =
                          context.resources.displayMetrics.density

                      val size =
                          min(widthDp, heightDp)
                              .coerceIn(120, 700)

                      val pixels =
                          (size * density)
                              .toInt()
                              .coerceIn(240, 1800)

                      val bitmap =
                          drawClock(pixels, pixels)

                      val views =
                          RemoteViews(
                              context.packageName,
                              R.layout.widget_spider_clock
                          )

                      views.setImageViewBitmap(
                          R.id.clock_image,
                          bitmap
                      )

                      val open =
                          Intent(
                              context,
                              MainActivity::class.java
                          )

                      val pending =
                          PendingIntent.getActivity(
                              context,
                              id,
                              open,
                              PendingIntent.FLAG_UPDATE_CURRENT or
                                  immutableFlag()
                          )

                      views.setOnClickPendingIntent(
                          R.id.clock_image,
                          pending
                      )

                      manager.updateAppWidget(id, views)
                  }

                  private fun immutableFlag(): Int {
                      return if (Build.VERSION.SDK_INT >= 23) {
                          PendingIntent.FLAG_IMMUTABLE
                      } else {
                          0
                      }
                  }

                  private fun scheduleNextMinute(
                      context: Context
                  ) {

                      val alarmManager =
                          context.getSystemService(
                              Context.ALARM_SERVICE
                          ) as AlarmManager

                      val intent =
                          Intent(
                              context,
                              SpiderClockWidget::class.java
                          ).apply {
                              action = ACTION_TICK
                          }

                      val pending =
                          PendingIntent.getBroadcast(
                              context,
                              9001,
                              intent,
                              PendingIntent.FLAG_UPDATE_CURRENT or
                                  immutableFlag()
                          )

                      val calendar =
                          Calendar.getInstance().apply {
                              set(Calendar.SECOND, 0)
                              set(Calendar.MILLISECOND, 0)
                              add(Calendar.MINUTE, 1)
                          }

                      alarmManager.set(
                          AlarmManager.RTC,
                          calendar.timeInMillis,
                          pending
                      )
                  }

                  private fun cancelTick(
                      context: Context
                  ) {

                      val alarmManager =
                          context.getSystemService(
                              Context.ALARM_SERVICE
                          ) as AlarmManager

                      val intent =
                          Intent(
                              context,
                              SpiderClockWidget::class.java
                          ).apply {
                              action = ACTION_TICK
                          }

                      val pending =
                          PendingIntent.getBroadcast(
                              context,
                              9001,
                              intent,
                              PendingIntent.FLAG_UPDATE_CURRENT or
                                  immutableFlag()
                          )

                      alarmManager.cancel(pending)
                  }

                  private fun drawClock(
                      width: Int,
                      height: Int
                  ): Bitmap {

                      val bitmap =
                          Bitmap.createBitmap(
                              width,
                              height,
                              Bitmap.Config.ARGB_8888
                          )

                      val canvas =
                          Canvas(bitmap)

                      canvas.drawColor(
                          Color.TRANSPARENT,
                          PorterDuff.Mode.CLEAR
                      )

                      val cx = width / 2f
                      val cy = height / 2f
                      val radius =
                          min(width, height) * 0.455f

                      val background =
                          Paint(Paint.ANTI_ALIAS_FLAG)

                      background.shader =
                          LinearGradient(
                              0f,
                              0f,
                              width.toFloat(),
                              height.toFloat(),
                              Color.rgb(176, 91, 4),
                              Color.rgb(112, 56, 0),
                              Shader.TileMode.CLAMP
                          )

                      canvas.drawRect(
                          0f,
                          0f,
                          width.toFloat(),
                          height.toFloat(),
                          background
                      )

                      val white =
                          Color.argb(
                              245,
                              250,
                              250,
                              250
                          )

                      val ring =
                          Paint(Paint.ANTI_ALIAS_FLAG).apply {
                              color =
                                  Color.argb(
                                      28,
                                      255,
                                      255,
                                      255
                                  )

                              style =
                                  Paint.Style.STROKE

                              strokeWidth =
                                  maxOf(
                                      1f,
                                      width / 320f
                                  )
                          }

                      canvas.drawCircle(
                          cx,
                          cy,
                          radius * 0.86f,
                          ring
                      )

                      canvas.drawCircle(
                          cx,
                          cy,
                          radius * 0.67f,
                          ring
                      )

                      val numbers =
                          Paint(Paint.ANTI_ALIAS_FLAG).apply {
                              color =
                                  Color.argb(
                                      180,
                                      245,
                                      245,
                                      245
                                  )

                              textAlign =
                                  Paint.Align.CENTER

                              typeface =
                                  Typeface.create(
                                      "sans",
                                      Typeface.NORMAL
                                  )

                              textSize =
                                  radius * 0.12f
                          }

                      for (number in 1..12) {

                          val angle =
                              Math.toRadians(
                                  number * 30.0 - 90.0
                              )

                          val nr =
                              radius * 0.78f

                          val x =
                              cx +
                                  cos(angle).toFloat() *
                                  nr

                          val y =
                              cy +
                                  sin(angle).toFloat() *
                                  nr -
                                  (
                                      numbers.ascent() +
                                          numbers.descent()
                                  ) / 2f

                          canvas.drawText(
                              number.toString(),
                              x,
                              y,
                              numbers
                          )
                      }

                      val now =
                          Calendar.getInstance()

                      val hour =
                          now.get(Calendar.HOUR) +
                              now.get(Calendar.MINUTE) / 60f

                      val minute =
                          now.get(Calendar.MINUTE) +
                              now.get(Calendar.SECOND) / 60f

                      val hourAngle =
                          Math.toRadians(
                              hour * 30.0 - 90.0
                          )

                      val minuteAngle =
                          Math.toRadians(
                              minute * 6.0 - 90.0
                          )

                      val legs =
                          Paint(Paint.ANTI_ALIAS_FLAG).apply {
                              color = white
                              style =
                                  Paint.Style.STROKE
                              strokeCap =
                                  Paint.Cap.ROUND
                              strokeJoin =
                                  Paint.Join.ROUND
                              strokeWidth =
                                  maxOf(
                                      2.2f,
                                      width / 105f
                                  )
                          }

                      for (i in 0 until 8) {

                          val angle =
                              Math.toRadians(
                                  i * 45.0 + 7.0
                              )

                          val inner =
                              radius * 0.06f

                          val middle =
                              radius * 0.26f

                          val outer =
                              radius * 0.46f

                          val x1 =
                              cx +
                                  cos(angle).toFloat() *
                                  inner

                          val y1 =
                              cy +
                                  sin(angle).toFloat() *
                                  inner

                          val x2 =
                              cx +
                                  cos(angle).toFloat() *
                                  middle

                          val y2 =
                              cy +
                                  sin(angle).toFloat() *
                                  middle

                          val bend =
                              angle +
                                  if (sin(angle) >= 0) {
                                      0.16
                                  } else {
                                      -0.16
                                  }

                          val x3 =
                              cx +
                                  cos(bend).toFloat() *
                                  outer

                          val y3 =
                              cy +
                                  sin(bend).toFloat() *
                                  outer

                          val path =
                              Path().apply {
                                  moveTo(x1, y1)
                                  lineTo(x2, y2)
                                  lineTo(x3, y3)
                              }

                          canvas.drawPath(
                              path,
                              legs
                          )
                      }                      drawHand(
                          canvas,
                          cx,
                          cy,
                          hourAngle,
                          radius * 0.59f,
                          maxOf(
                              3f,
                              width / 70f
                          ),
                          white
                      )

                      drawHand(
                          canvas,
                          cx,
                          cy,
                          minuteAngle,
                          radius * 0.77f,
                          maxOf(
                              2.3f,
                              width / 90f
                          ),
                          white
                      )

                      val body =
                          Paint(Paint.ANTI_ALIAS_FLAG).apply {
                              color = Color.WHITE
                              style =
                                  Paint.Style.FILL
                          }

                      canvas.drawOval(
                          cx - radius * 0.085f,
                          cy - radius * 0.13f,
                          cx + radius * 0.085f,
                          cy + radius * 0.12f,
                          body
                      )

                      canvas.drawCircle(
                          cx,
                          cy - radius * 0.15f,
                          radius * 0.10f,
                          body
                      )

                      canvas.drawCircle(
                          cx,
                          cy,
                          radius * 0.035f,
                          Paint(Paint.ANTI_ALIAS_FLAG).apply {
                              color =
                                  Color.rgb(
                                      112,
                                      56,
                                      0
                                  )

                              style =
                                  Paint.Style.FILL
                          }
                      )

                      return bitmap
                  }

                  private fun drawHand(
                      canvas: Canvas,
                      cx: Float,
                      cy: Float,
                      angle: Double,
                      length: Float,
                      strokeWidth: Float,
                      color: Int
                  ) {

                      val paint =
                          Paint(Paint.ANTI_ALIAS_FLAG).apply {
                              this.color = color
                              style =
                                  Paint.Style.STROKE
                              strokeCap =
                                  Paint.Cap.ROUND
                              this.strokeWidth =
                                  strokeWidth
                          }

                      val endX =
                          cx +
                              cos(angle).toFloat() *
                              length

                      val endY =
                          cy +
                              sin(angle).toFloat() *
                              length

                      canvas.drawLine(
                          cx,
                          cy,
                          endX,
                          endY,
                          paint
                      )
                  }
              }
          }
          EOF

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          gradle --no-daemon --stacktrace assembleDebug

      - name: Build release APK
        shell: bash
        run: |
          set -e
          gradle --no-daemon --stacktrace assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SpiderClock-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: SpiderClock-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
