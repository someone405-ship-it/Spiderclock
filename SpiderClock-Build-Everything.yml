name: Build Spider Clock APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Create complete Android project
        shell: bash
        run: |
          mkdir -p "$(dirname 'README.md')"
          cat > 'README.md' <<'EOF_6169066586091668968'
          # Spider Clock
          
          Android home-screen widget inspired by the supplied Spider Clock reference.
          
          Features:
          - Live hour and minute shown as long spider legs
          - Eight thin spider legs
          - White spider body and hands
          - 1 to 12 clock numbers
          - Warm brown reference-style background
          - Resizeable home-screen widget
          - Refreshes every minute
          - Tap the widget to open the app
          
          ## Build the APK
          
          1. Open this folder in Android Studio.
          2. Let Gradle sync.
          3. Run `app > Tasks > build > assembleDebug`.
          
          The APK will be at:
          `app/build/outputs/apk/debug/app-debug.apk`
          
          There is also a GitHub Actions workflow at `.github/workflows/build-apk.yml` that builds the APK automatically when pushed to GitHub.
          EOF_6169066586091668968

